plugins {
  id 'application'
  id 'java'
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'maven-publish'
  id 'com.github.ben-manes.versions' version '0.60.0'
  id 'org.cyclonedx.bom' version '3.3.0'
  id 'com.gorylenko.gradle-git-properties' version '4.0.1'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('ARTEFACT_VERSION') ?: '0.0.999'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/dependency.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/jar.gradle")
  from("$rootDir/gradle/apispec-validation.gradle")
}

// Contract jars whose versions validateApiSpecVersions checks on release.
configurations {
  apiSpec
}

// We MUST keep all dependencies in the build.gradle to allow dependabot to provide version updates
// Sadly, dependabot does not track dependencies in the apply-from files
dependencies {
  // Api spec: this service's own contract (generated EnforcementHearingApi + HearingResulted models).
  // Draft published from api-cp-crime-results-enforcementgateway team/CCT-1222 (merge 7a13f17). Replace with a
  // fixed X.Y.Z release before a release build: validateApiSpecVersions rejects draft versions.
  implementation('uk.gov.hmcts.cp:api-cp-crime-results-enforcementgateway:0.0.0-7a13f17')
  apiSpec('uk.gov.hmcts.cp:api-cp-crime-results-enforcementgateway:0.0.0-7a13f17')
  // Generated models carry @Schema annotations; needed on the compile classpath (-Werror), as in service-cp-crime-results-pcr
  implementation 'io.swagger.core.v3:swagger-annotations:2.2.55'

  // Java core
  implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

  compileOnly 'org.projectlombok:lombok:1.18.46'
  annotationProcessor 'org.projectlombok:lombok:1.18.46'
  testCompileOnly 'org.projectlombok:lombok:1.18.46'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

  // Spring boot core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
  // Validates responses against this service's own contract in the API jar (workflow research.md R25)
  testImplementation 'com.networknt:json-schema-validator:1.5.9'
  testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
  testImplementation('org.springframework.boot:spring-boot-starter-test') {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }


  // --- Observability / Actuator / OTEL / Prometheus ---
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

  // Security: pin transitive tomcat-embed-core to patched version (CVE-2026-41293, -43512, et al.)
  // Brought in transitively via spring-boot-starter-web; >=11.0.0-M1,<11.0.22 are vulnerable
  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'

  // --- Messaging: durable subscription to the CP 'public.event' Artemis topic (connectivity logging) ---
  implementation 'org.springframework.boot:spring-boot-starter-artemis'
}

// Guard against legacy javax.jms on the classpath alongside Spring Boot 4's jakarta.jms.
configurations.all {
  exclude group: 'javax.jms', module: 'javax.jms-api'
  exclude group: 'org.apache.activemq', module: 'artemis-jms-client'
}
